// ---------- Verbatims ----------
function renderVerbatims(data, commentCol, motifCol, satCol, resoluCol) {
  const wrap = document.getElementById('verbatims');
  if (!commentCol) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'grid';

  const rows = data.map(r => ({
    text: r[commentCol],
    agence: r['Agence'],
    sat: satCol ? r[satCol] : null,
    resolu: resoluCol ? String(r[resoluCol]||'').trim() : null,
    motif: motifCol ? r[motifCol] : null,
  })).filter(c => c.text && String(c.text).trim());

  const isNegRating = v => v && /insatisfait/i.test(v);
  const isPosRating = v => v && /satisfait/i.test(v) && !/insatisfait/i.test(v);

  // Classement STRICTEMENT exclusif (chaque commentaire va dans une seule
  // colonne) : l'ancienne version utilisait deux filtres indépendants
  // (OR), ce qui laissait un même commentaire apparaître à la fois en
  // positif ET en négatif dès que le champ "motif d'insatisfaction" n'était
  // pas vide alors que la note était positive (incohérence possible dans
  // l'export du questionnaire). Ici, chaque ligne est d'abord testée pour
  // "négatif" ; si elle n'y correspond pas, alors seulement on regarde si
  // elle est "positive" — jamais les deux à la fois.
  const negatifs = [];
  const positifs = [];
  for (const c of rows) {
    const estNegatif = isNegRating(c.sat) || (c.resolu && /^non/i.test(c.resolu)) || (c.motif && String(c.motif).trim());
    if (estNegatif) {
      negatifs.push(c);
    } else if (isPosRating(c.sat)) {
      positifs.push(c);
    }
  }

  // Pertinence : commentaires les plus détaillés (plus longs = plus informatifs) en priorité
  const bySubstance = (a,b) => String(b.text).trim().length - String(a.text).trim().length;
  negatifs.sort(bySubstance);
  positifs.sort(bySubstance);

  const posList = document.getElementById('vposList');
  const negList = document.getElementById('vnegList');

  posList.innerHTML = positifs.slice(0,15).map(c => `<div class="vitem pos">${escapeHtml(c.text.trim())}</div>`).join('') || '<div class="vitem pos">Aucun verbatim positif</div>';
  negList.innerHTML = negatifs.slice(0,15).map(c => `<div class="vitem neg">${escapeHtml(c.text.trim())}</div>`).join('') || '<div class="vitem neg">Aucun verbatim négatif</div>';

  currentVerbatims = { positifs: positifs.map(c=>c.text.trim()), negatifs: negatifs.map(c=>c.text.trim()) };
  document.getElementById('verbatimSummaryBar').style.display = (positifs.length || negatifs.length) ? 'flex' : 'none';
  document.getElementById('vposSummary').style.display = 'none';
  document.getElementById('vnegSummary').style.display = 'none';
  document.getElementById('vposSummary').innerHTML = '';
  document.getElementById('vnegSummary').innerHTML = '';
  posList.style.display = 'block';
  negList.style.display = 'block';
  document.getElementById('toggleVerbatimListBtn').style.display = 'none';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Table ----------
function renderTable(data, columns) {
  const inner = document.getElementById('tableInner');
  const cols = columns.slice(0, 12); // limite d'affichage
  const colLabel = c => NICE_TITLE[c] || (c === 'Horodatage' ? 'Date de réponse' : c);
  let html = '<table><thead><tr>' + cols.map(c=>`<th>${colLabel(c)}</th>`).join('') + '</tr></thead><tbody>';
  data.forEach(r => { // toutes les lignes (plus de limite à 50)
    html += '<tr>' + cols.map(c=>`<td>${r[c] instanceof Date ? r[c].toLocaleString() : (r[c] ?? '')}</td>`).join('') + '</tr>';
  });
  html += '</tbody></table>';
  inner.innerHTML = html;
}

// ---------- Agrandir / Télécharger ----------
let modalChart = null;

function openChartModal(id) {
  const src = chartInstancesBySlot[id];
  if (!src) return;
  document.getElementById('modalTitle').textContent = src._title || '';
  document.getElementById('modalOverlay').classList.add('active');

  const wrap = document.getElementById('modalCanvasWrap');
  wrap.innerHTML = '<canvas id="modalCanvas"></canvas>';
  const modalCanvasEl = document.getElementById('modalCanvas');
  modalCanvasEl.dataset.chartId = id; // même id -> partage les étiquettes déplacées avec la carte d'origine

  if (src._isWordCloud) {
    modalCanvasEl.style.width = '100%';
    modalCanvasEl.style.height = '100%';
    if (modalChart) { modalChart.destroy(); modalChart = null; }
    requestAnimationFrame(() => {
      requestAnimationFrame(() => drawWordCloud(modalCanvasEl, src._labels, src._values));
    });
    document.getElementById('modalDownload').onclick = () => downloadCanvas(modalCanvasEl, src._title);
    return;
  }

  const ctx = modalCanvasEl.getContext('2d');
  if (modalChart) modalChart.destroy();
  modalChart = new Chart(ctx, {
    type: src.config.type,
    data: JSON.parse(JSON.stringify(src.config.data)),
    options: Object.assign({}, src.config.options, { responsive:true, maintainAspectRatio:false })
  });
  enableLabelDragging(modalChart, modalCanvasEl);
  document.getElementById('modalDownload').onclick = () => downloadCanvas(document.getElementById('modalCanvas'), src._title);
}

function closeChartModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  if (modalChart) { modalChart.destroy(); modalChart = null; }
}

function downloadCanvas(canvas, title) {
  const name = (title || 'graphique').replace(/[^a-z0-9]+/gi,'_').toLowerCase().slice(0,60);
  let dataUrl;
  try {
    // fond blanc (les canvas Chart.js sont transparents par défaut)
    const tmp = document.createElement('canvas');
    tmp.width = canvas.width; tmp.height = canvas.height;
    const tctx = tmp.getContext('2d');
    tctx.fillStyle = '#ffffff';
    tctx.fillRect(0,0,tmp.width,tmp.height);
    tctx.drawImage(canvas, 0, 0);
    dataUrl = tmp.toDataURL('image/png');
  } catch (e) {
    console.error('Export PNG impossible', e);
    alert("Le téléchargement direct n'a pas fonctionné dans cet aperçu. Ouvre le fichier HTML dans un onglet de navigateur complet (pas dans l'aperçu intégré) puis réessaie.");
    return;
  }
  const link = document.createElement('a');
  link.download = name + '.png';
  link.href = dataUrl;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  setTimeout(() => document.body.removeChild(link), 100);
}

function downloadChartById(id) {
  const src = chartInstancesBySlot[id];
  if (!src) return;
  downloadCanvas(src.canvas, src._title);
}

document.getElementById('modalClose').onclick = closeChartModal;
document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeChartModal(); };

// ---------- Résumé IA des verbatims (Google Gemini) ----------
// gemini-2.5-flash-lite, gemini-3.1-flash-lite et gemini-2.5-flash ont été
// RETIRÉS par Google (404 "no longer available to new users") — c'était la
// vraie cause de fond des échecs de commentaire dans toute l'application.
// gemini-3.6-flash retiré : "gemini-flash-latest" pointait vers ce même
// modèle (quota gratuit plafonné à 20 requêtes/jour, vu dans un message
// d'erreur réel) — le "secours" retombait donc sur le modèle déjà épuisé.
// Remplacé par gemini-3.7-flash (sorti le 13/08/2026), un modèle
// RÉELLEMENT différent, avec son propre quota séparé.
const GEMINI_MODEL_CHAIN = [
  'gemini-3.5-flash-lite',
  'gemini-3.7-flash',
];

async function callGeminiWithFallback(prompt, apiKey) {
  let lastError = null;
  for (const model of GEMINI_MODEL_CHAIN) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
    // Délai maximum de 10s avant d'abandonner ce modèle et de basculer sur
    // le suivant — bug corrigé ici : sans AbortController, fetch() attend
    // la réponse du navigateur SANS aucune limite (parfois plusieurs
    // minutes en cas de requête bloquée côté Google), ce qui donnait
    // l'impression que tout était figé plutôt que de basculer rapidement.
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    try {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.3 }
        }),
        signal: controller.signal,
      });
      clearTimeout(timeoutId);

      if (response.status === 429 || response.status === 503 || response.status === 404) {
        lastError = new Error(`${model} indisponible (${response.status}), bascule sur le modèle suivant`);
        console.warn(lastError.message);
        continue;
      }
      if (!response.ok) {
        const errBody = await response.text();
        throw new Error(`${model} a répondu ${response.status} : ${errBody.slice(0,200)}`);
      }

      const data = await response.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) { lastError = new Error(`${model} : réponse vide ou inattendue`); continue; }
      return { text, modelUsed: model };
    } catch (e) {
      clearTimeout(timeoutId);
      if (e instanceof TypeError && /fetch/i.test(e.message)) {
        // Échec réseau (pas une erreur de l'API) : inutile d'essayer les autres modèles, la cause est la même
        throw new Error("Impossible de joindre l'API Gemini (réseau bloqué). Si tu es dans l'aperçu du chat, télécharge le fichier et ouvre-le dans un vrai onglet de navigateur, puis réessaie.");
      }
      lastError = e;
      continue;
    }
  }
  throw lastError || new Error('Tous les modèles Gemini de la chaîne ont échoué');
}

async function summarizeSide(items, sentiment, apiKey) {
  if (!items.length) return [];
  const sample = items.slice(0, 60); // limite raisonnable pour le prompt
  const prompt = `Voici des commentaires clients ${sentiment==='positif' ? 'positifs' : 'négatifs'} recueillis dans des agences. Résume-les en AU MAXIMUM 4 points clés (pas plus), courts, concrets, sans doublons, qui capturent les thèmes récurrents. Réponds UNIQUEMENT avec un objet JSON de la forme {"points": ["...", "..."]}, sans aucun texte avant ou après, sans balises markdown.

Commentaires :
${sample.map((t,i)=>`${i+1}. ${t}`).join('\n')}`;

  const { text, modelUsed } = await callGeminiWithFallback(prompt, apiKey);
  const cleaned = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(cleaned);
  return (parsed.points || []).slice(0,4);
}

// ---------- Commentaire IA "façon statisticien", bref et global, par graphique ----------
function renderCommentHtml(text) {
  return `<span class="cLabel">Commentaire</span>${escapeHtml(text)}`;
}

async function commentOneChart(id, apiKey) {
  const summary = chartDataSummaries[id];
  if (!summary) return null;
  const prompt = `Voici le résumé chiffré d'un graphique de rapport de satisfaction client, intitulé « ${summary.title} » :

${JSON.stringify({ labels: summary.labels, datasets: summary.datasets, repartition_exacte_pourcent: summary.repartition_exacte }, null, 2)}

Rédige UNE SEULE phrase globale (deux maximum si vraiment nécessaire), en français, façon punchline, pour un responsable de Direction Marketing. Exemple de ton attendu : "Le questionnaire a explosé jusqu'à 205 réponses en mai, puis s'est effondré de 64% en juin, avant une timide reprise en juillet."

EXIGENCES STRICTES :
- BREF et GLOBAL : ne détaille PAS chaque point/catégorie un par un — dégage juste la tendance ou le fait marquant qui résume tout le graphique.
- Utilise de VRAIS chiffres du résumé ci-dessus (valeurs, écarts en %, ordres de grandeur) — jamais de commentaire vague sans nombre.
- EXACTITUDE OBLIGATOIRE : donne toujours la valeur exacte (ex: "89,43 %"), jamais une approximation ("près de 90%", "environ 90%", "quasiment 90%"). Si le champ "repartition_exacte_pourcent" est présent, UTILISE ces pourcentages tels quels (déjà calculés avec précision) plutôt que de recalculer toi-même. Si tu cites un effectif ET un taux, le format est "223 sur 227, soit 89,43 %" — jamais le taux seul arrondi au grossier.
- Ton dynamique et direct (verbes d'action : explose, s'effondre, stagne, rebondit, se maintient...), pas de style rapport administratif.
- Interdiction absolue de lister ou commenter chaque catégorie séparément.
- Réponds UNIQUEMENT avec la phrase, sans titre, sans guillemets, sans markdown.`;

  const { text } = await callGeminiWithFallback(prompt, apiKey);
  return text.trim();
}

document.getElementById('commentAllBtn').onclick = async () => {
  const btn = document.getElementById('commentAllBtn');
  const status = document.getElementById('commentAllStatus');
  const apiKey = EMBEDDED_GEMINI_KEY;

  if (!apiKey) {
    status.textContent = "Fonction IA non configurée (clé Gemini absente côté serveur).";
    return;
  }
  const ids = Object.keys(chartDataSummaries);
  if (!ids.length) {
    status.textContent = "Aucun graphique à commenter pour l'instant.";
    return;
  }

  btn.disabled = true;
  let done = 0;
  for (const id of ids) {
    status.textContent = `Commentaire en cours... (${done + 1}/${ids.length})`;
    try {
      const text = await commentOneChart(id, apiKey);
      if (text) {
        chartComments[id] = text;
        const box = document.querySelector(`.chartComment[data-slot="${id}"]`);
        if (box) { box.classList.add('filled'); box.innerHTML = renderCommentHtml(text); }
      }
    } catch (e) {
      console.error('Commentaire IA échoué pour', id, e);
    }
    done++;
  }
  status.textContent = `${done} graphique(s) commenté(s).`;
  btn.disabled = false;
  saveDashboardState();
};



document.getElementById('summarizeBtn').onclick = async () => {
  const btn = document.getElementById('summarizeBtn');
  const status = document.getElementById('summarizeStatus');
  const apiKey = EMBEDDED_GEMINI_KEY;

  if (!apiKey) {
    status.textContent = "Fonction IA non configurée (clé Gemini absente côté serveur).";
    return;
  }

  btn.disabled = true;
  status.textContent = 'Analyse en cours…';

  try {
    const [posPoints, negPoints] = await Promise.all([
      summarizeSide(currentVerbatims.positifs, 'positif', apiKey),
      summarizeSide(currentVerbatims.negatifs, 'negatif', apiKey)
    ]);

    const posBox = document.getElementById('vposSummary');
    const negBox = document.getElementById('vnegSummary');

    posBox.innerHTML = posPoints.length
      ? `<div class="vSummaryTitle">Résumé en ${posPoints.length} points</div><ul>${posPoints.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>`
      : '<div class="vSummaryTitle">Pas assez de commentaires pour résumer</div>';
    negBox.innerHTML = negPoints.length
      ? `<div class="vSummaryTitle">Résumé en ${negPoints.length} points</div><ul>${negPoints.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>`
      : '<div class="vSummaryTitle">Pas assez de commentaires pour résumer</div>';
    posBox.style.display = 'block';
    negBox.style.display = 'block';
    currentVerbatimSummary = { positifs: posPoints, negatifs: negPoints };

    // Une fois le résumé généré, la liste brute des verbatims est masquée
    // par défaut (le résumé suffit à l'œil) — mais reste entièrement
    // disponible : un bouton permet de la réafficher/masquer à volonté,
    // au lieu de la supprimer définitivement comme avant.
    document.getElementById('vposList').style.display = 'none';
    document.getElementById('vnegList').style.display = 'none';
    const toggleBtn = document.getElementById('toggleVerbatimListBtn');
    toggleBtn.textContent = '👁️ Afficher les verbatims détaillés';
    toggleBtn.dataset.state = 'hidden';
    toggleBtn.style.display = 'inline-block';
    saveDashboardState();

    status.textContent = '';
  } catch (e) {
    console.error(e);
    status.textContent = "Échec du résumé : " + e.message;
  } finally {
    btn.disabled = false;
  }
};

// Bascule manuelle : montre/masque la liste brute des verbatims, sans
// jamais la recalculer ni la perdre — juste un show/hide.
document.getElementById('toggleVerbatimListBtn').onclick = () => {
  const posList = document.getElementById('vposList');
  const negList = document.getElementById('vnegList');
  const toggleBtn = document.getElementById('toggleVerbatimListBtn');
  const isHidden = posList.style.display === 'none';
  posList.style.display = isHidden ? 'block' : 'none';
  negList.style.display = isHidden ? 'block' : 'none';
  toggleBtn.dataset.state = isHidden ? 'shown' : 'hidden';
  toggleBtn.textContent = isHidden ? '👁️ Masquer les verbatims détaillés' : '👁️ Afficher les verbatims détaillés';
  saveDashboardState();
};
